<h2 mat-dialog-title>{{data.title || 'Подтверждение'}}</h2>

<mat-dialog-content>
  <div class="dialog-content">
    <mat-icon class="warning-icon" *ngIf="!data.title?.includes('успех')">warning</mat-icon>
    <mat-icon class="success-icon" *ngIf="data.title?.includes('успех')">check_circle</mat-icon>
    
    <div class="message-container">
      <p class="dialog-message">{{data.message}}</p>
      
      <!-- Дополнительная информация -->
      <div class="additional-info" *ngIf="data.additionalInfo">
        <p>{{data.additionalInfo}}</p>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <!-- Кнопка отмены -->
  <button mat-button 
          [color]="data.cancelColor || 'default'" 
          (click)="onCancel()"
          class="cancel-button">
    {{data.cancelText || 'Отмена'}}
  </button>
  
  <!-- Кнопка подтверждения -->
  <button mat-raised-button 
          [color]="data.confirmColor || 'warn'" 
          (click)="onConfirm()"
          class="confirm-button"
          [class.danger]="data.confirmColor === 'warn'">
    {{data.confirmText || 'Подтвердить'}}
  </button>
</mat-dialog-actions>
