<mat-toolbar color="primary" class="header-toolbar">
  <!-- Логотип и название -->
  <div class="logo-section" routerLink="/teachers">
    <mat-icon class="logo-icon">school</mat-icon>
    <span class="logo-text">Рейтинг преподавателей</span>
  </div>

  <span class="spacer"></span>

  <!-- Навигация -->
  <nav class="nav-section">
    <button mat-button routerLink="/teachers" routerLinkActive="active-link">
      <mat-icon>people</mat-icon>
      <span class="nav-text">Преподаватели</span>
    </button>

    <button mat-button routerLink="/students" routerLinkActive="active-link" 
            *ngIf="isLoggedIn">
      <mat-icon>school</mat-icon>
      <span class="nav-text">Студенты</span>
    </button>

    <button mat-button routerLink="/ratings" routerLinkActive="active-link"
            *ngIf="isLoggedIn">
      <mat-icon>star_rate</mat-icon>
      <span class="nav-text">Оценки</span>
    </button>

    <!-- Админские ссылки -->
    <button mat-button routerLink="/admin-teachers" routerLinkActive="active-link"
            *ngIf="isAdmin">
      <mat-icon>admin_panel_settings</mat-icon>
      <span class="nav-text">Админ-панель</span>
    </button>
  </nav>

  <span class="spacer"></span>

  <!-- Пользовательская секция -->
  <div class="user-section">
    <!-- Гость -->
    <div *ngIf="!isLoggedIn" class="guest-section">
      <button mat-button routerLink="/login" color="accent">
        <mat-icon>login</mat-icon>
        <span class="nav-text">Войти</span>
      </button>
    </div>

    <!-- Авторизованный пользователь -->
    <div *ngIf="isLoggedIn" class="logged-in-section">
      <mat-icon class="user-icon">account_circle</mat-icon>
      <div class="user-info">
        <span class="username">{{getGreeting()}}</span>
        <button mat-button color="warn" (click)="logout()" class="logout-button">
          <mat-icon>logout</mat-icon>
          <span class="nav-text">Выйти</span>
        </button>
      </div>
    </div>
  </div>
</mat-toolbar>
